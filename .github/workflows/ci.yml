name: Knowra CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: knowra_admin
          POSTGRES_PASSWORD: knowra_secret
          POSTGRES_DB: knowra_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package.json'

      - name: Install dependencies
        run: npm ci

      - name: Run Prisma Generate
        run: npx prisma generate

      - name: Type Check
        run: npm run typecheck

      - name: Run Vitest Unit Tests
        run: npm run test

      - name: Build Next.js Application
        run: npm run build
        env:
          DATABASE_URL: "postgresql://knowra_admin:knowra_secret@localhost:5432/knowra_test_db?schema=public"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          AUTH_SECRET: "ci-test-secret-value-must-be-at-least-32-characters"
          AI_PROVIDER: "mock"
